# NyayaVault — M0 development stack
#
# LOCAL DEVELOPMENT ONLY. Ports are bound to the host and the API runs with
# hot-reload. Every credential comes from the .env file; nothing is hardcoded.

name: nyayavault

services:
  # ---------------------------------------------------------------- database
  db:
    # pgvector image so the `vector` extension is available for the later
    # semantic-search milestone. M0 only ENABLES the extension; it does not
    # create or query any vector columns yet.
    image: pgvector/pgvector:pg16
    container_name: nyayavault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------- object storage
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: nyayavault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------------------- api
  backend:
    build:
      context: ./backend
    container_name: nyayavault-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network services resolve by name, overriding the
      # host-oriented values that live in .env.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - contract-artifacts:/artifacts
    command: >
      sh -c "alembic upgrade head && 
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ---------------------------------------------------------------- blockchain
  hardhat-node:
    image: node:20-alpine
    container_name: nyayavault-hardhat-node
    working_dir: /blockchain
    volumes:
      - ./blockchain:/blockchain
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Content-Type: application/json\" --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' -O - http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  contract-deploy:
    image: node:20-alpine
    container_name: nyayavault-contract-deploy
    working_dir: /blockchain
    volumes:
      - ./blockchain:/blockchain
      - contract-artifacts:/artifacts
    environment:
      ARTIFACTS_DIR: /artifacts
    command: sh -c "npx hardhat run scripts/deploy.js --network docker"
    depends_on:
      hardhat-node:
        condition: service_healthy

  # -------------------------------------------------------------------- web
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: nyayavault-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  contract-artifacts:
